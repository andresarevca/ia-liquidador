services:

  ia:
    image: ghcr.io/andresarevca/ia-liquidador:latest
    container_name: ia_liquidador
    env_file:
      - .env
    volumes:
      - vector_db:/app/vector_db
      - /tmp/ia-liquidador:/tmp/ia-liquidador
    restart: unless-stopped
    networks:
      - backend-liquidador_backend_liquidador_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/pipeline/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  vector_db:

networks:
  backend-liquidador_backend_liquidador_network:
    external: true
